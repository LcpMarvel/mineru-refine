[package]
name = "mineru-refine-py"
description = "PyO3 wrapper over the mineru-refine core — powers the PyPI package."
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "mineru_refine"
crate-type = ["cdylib"]

[dependencies]
mineru-refine-core = { package = "mineru-refine", path = "../../crates/mineru-refine" }
serde_json.workspace = true
tokio.workspace = true
# abi3-py39：一个平台一个 wheel 通吃 Python >= 3.9，CI 不用按解释器版本展开矩阵
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py39"] }
pythonize = "0.28.0"
