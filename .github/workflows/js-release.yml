# npm 发布：打 tag（v*）触发，四平台并行构建 → 测试 → 发布 4 个平台子包 + 主包。
# 前置：仓库 secrets 里配 NPM_TOKEN（granular token，Read/Write，作用域选 All packages，
# 否则无法创建新的平台子包）。手动跑 workflow_dispatch 只构建+测试，不发布。
name: JS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBUG: 'napi:*'
  MACOSX_DEPLOYMENT_TARGET: '10.13'

defaults:
  run:
    working-directory: bindings/js

jobs:
  build:
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: '--use-napi-cross'
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: '--use-napi-cross'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            target/
          key: cargo-${{ matrix.settings.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.settings.target }}-
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bunx napi build --platform --release --target ${{ matrix.settings.target }} ${{ matrix.settings.cross }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/js/mineru-refine.*.node
          if-no-files-found: error

  # 在能跑原生二进制的 runner 上验证构建产物（darwin-x64 没有对应免费 runner，跳过）
  test:
    name: test ${{ matrix.settings.target }}
    needs: build
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/js
      - name: Test
        run: bun run test

  publish:
    name: publish npm
    needs:
      - build
      - test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # napi pre-publish 会创建 GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Create npm dirs
        run: bunx napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/js/artifacts
      - name: Move artifacts
        run: bunx napi artifacts
      - name: List packages
        run: ls -R npm
      - name: Publish
        run: |
          npm config set provenance true
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          bunx napi pre-publish -t npm
          npm publish --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
