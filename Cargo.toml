[workspace]
resolver = "3"
members = [
    "bindings/python",
    "bindings/js",
    "crates/mineru-refine",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
repository = "https://github.com/LcpMarvel/mineru-refine"
rust-version = "1.85"
license = "MIT"
authors = ["LcpMarvel <lcpmarvel@gmail.com>"]

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
regex = "1.12.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "time", "io-std", "io-util", "sync"] }
futures = "0.3.32"
async-trait = "0.1.89"
# rustls 不能走默认的 aws-lc-rs：aws-lc-sys 的 C 代码在 napi 交叉工具链下编不过
#（缺 stdatomic.h），改用 ring provider；rustls-no-provider 要求运行时手动 install_default（见 llm.rs）
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
base64 = "0.22.1"
thiserror = "2.0.18"
# 本地/CI 构建走 git（钉到 0.1.1 对应提交）；cargo publish 时自动剥掉 git、改用 crates.io 的 version——
# 因此发布 mineru-refine 前，safe-json-repair 必须先发布到 crates.io（just publish-rust 有前置检查）
safe-json-repair = { git = "https://github.com/LcpMarvel/safe-json-repair", rev = "2aaaefdb9e3f12d1f96c4d5c06f2da46e4d79d14", version = "0.1.1" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
